<!-- One-Click Free Guest Access Form -->
<form action="$(link-login-only)" method="post" class="mt-3">
  <input type="hidden" name="dst" value="$(link-orig)" />
  <input type="hidden" name="username" value="guest" />
  <input type="hidden" name="password" value="" />
  <button type="submit" class="btn btn-outline-warning w-100 py-2">
    <i class="bi bi-lightning-charge-fill"></i> Free Guest Access (30 Min Limit)
  </button>
</form>
